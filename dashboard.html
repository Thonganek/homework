<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ระบบติดตามงาน</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">

    <style>
        :root {
            --primary-color: #059669; 
            --bg-gradient: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
        }
        body { font-family: 'Prompt', sans-serif; background: var(--bg-gradient); min-height: 100vh; padding-bottom: 50px; }
        
        .navbar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        .stat-card {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white; border-radius: 20px; padding: 30px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            text-align: center; margin-bottom: 20px; position: relative; overflow: hidden;
        }
        .stat-card h1 { font-size: 3.5rem; font-weight: 700; }
        
        .content-panel {
            background: var(--glass-bg); border-radius: 20px; padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-top: 20px;
        }

        /* Class ช่วยซ่อนปุ่มสำหรับคนทั่วไป */
        .admin-only { display: none !important; }

        @media (max-width: 768px) {
            .navbar-brand { font-size: 1.2rem; }
            .stat-card { padding: 20px; }
            .stat-card h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand text-success fw-bold" href="#"><i class="fas fa-chart-pie me-2"></i>AI Dashboard</a>
            <div class="ms-auto d-flex gap-2">
                <button class="btn btn-outline-success rounded-pill btn-sm" id="btnLoginNav" onclick="showLoginModal()">
                    <i class="fas fa-lock me-1"></i>Login
                </button>
                
                <div id="adminControls" class="d-none d-flex align-items-center">
                    <span class="text-success me-2 small fw-bold d-none d-md-block">
                        <i class="fas fa-user-check me-1"></i>Admin
                    </span>
                    <button class="btn btn-danger rounded-pill btn-sm" onclick="logout()">
                        <i class="fas fa-power-off me-1"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px;">
        
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="stat-card">
                    <i class="fas fa-users position-absolute" style="font-size: 8rem; opacity: 0.1; right: -20px; bottom: -20px;"></i>
                    <h3>ส่งงานแล้ว</h3>
                    <h1 id="submissionCount">...</h1>
                    <p class="mb-0">คน</p>
                </div>
            </div>
        </div>

        <div class="content-panel">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h4 class="text-success m-0"><i class="fas fa-list me-2"></i>รายชื่อผู้ส่งงาน</h4>
                
                <div class="d-flex gap-2">
                    <a href="form.html" target="_blank" class="btn btn-outline-primary rounded-pill shadow-sm">
                        <i class="fas fa-external-link-alt me-1"></i> ไปหน้าฟอร์ม
                    </a>

                    <button id="btnAdd" class="btn btn-success rounded-pill shadow-sm admin-only" onclick="openAddModal()">
                        <i class="fas fa-plus-circle me-1"></i> เพิ่มข้อมูล
                    </button>
                </div>
            </div>
            
            <div class="table-responsive">
                <table id="dataTable" class="table table-hover align-middle nowrap" style="width:100%">
                    <thead class="table-success">
                        <tr>
                            <th>เวลา</th>
                            <th>ชื่อ-สกุล</th>
                            <th>หน่วยงาน</th>
                            <th>โปรเจค</th>
                            <th class="text-center">จัดการ</th> </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="5" class="text-center">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="modal fade" id="loginModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-success text-white border-0 py-2">
                    <h6 class="modal-title"><i class="fas fa-key me-2"></i>Login Admin</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-3">
                    <form onsubmit="handleLoginSubmit(event)">
                        <div class="mb-2">
                            <input type="text" id="username" class="form-control" placeholder="Username" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" id="password" class="form-control" placeholder="Password" required>
                        </div>
                        <button type="submit" id="btnSubmitLogin" class="btn btn-success w-100 rounded-pill">
                            เข้าสู่ระบบ
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="dataModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-light border-0">
                    <h5 class="modal-title" id="modalTitle">เพิ่มข้อมูล</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="data_id">
                    <div class="mb-2"><label class="small text-muted">ชื่อ-สกุล</label><input type="text" id="data_fullname" class="form-control"></div>
                    <div class="mb-2"><label class="small text-muted">ชื่อเล่น</label><input type="text" id="data_nickname" class="form-control"></div>
                    <div class="mb-2"><label class="small text-muted">หน่วยงาน</label><input type="text" id="data_agency" class="form-control"></div>
                    <div class="mb-2"><label class="small text-muted">ชื่อโปรเจค</label><input type="text" id="data_project_name" class="form-control"></div>
                    <div class="mb-2"><label class="small text-muted">ลิ้งค์</label><input type="text" id="data_project_link" class="form-control"></div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" onclick="saveData()">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

    <script>
        // --- URL ของคุณ ---
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsFhpvIRRRYnd5MH2vLfbHS9Q8bPawuDw-MVqfvmhrJH_6Ur8GY2-YBvCciOj2tns-/exec';
        
        let loginModal, dataModal;
        let globalData = [];

        $(document).ready(function() {
            loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
            dataModal = new bootstrap.Modal(document.getElementById('dataModal'));
            
            checkAuthUI(); // ตรวจสอบสถานะ Login เพื่อโชว์ปุ่ม "เพิ่มข้อมูล"
            fetchStats();
            loadTableData(); // โหลดตาราง
        });

        // === Auth ===
        function showLoginModal() {
            $('#username').val(''); $('#password').val('');
            loginModal.show();
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            const u = $('#username').val(), p = $('#password').val();
            const btn = $('#btnSubmitLogin');
            const originalText = btn.html();

            btn.prop('disabled', true).html('ตรวจสอบ...');

            fetch(SCRIPT_URL, {
                method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', username: u, password: p })
            })
            .then(res => res.json())
            .then(data => {
                btn.prop('disabled', false).html(originalText);
                if (data.status === 'success') {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    loginModal.hide();
                    
                    // เมื่อ Login สำเร็จ ให้รีโหลดหน้าจอทันที เพื่อให้ระบบทุกอย่างเป็น Admin
                    Swal.fire({
                        icon: 'success', title: 'ยินดีต้อนรับ', text: 'กำลังเข้าสู่โหมด Admin...', 
                        timer: 1000, showConfirmButton: false
                    }).then(() => location.reload()); 
                } else {
                    Swal.fire({ icon: 'error', title: 'รหัสผิด' });
                }
            })
            .catch(err => {
                btn.prop('disabled', false).html(originalText);
                Swal.fire('Error', 'เชื่อมต่อไม่ได้', 'error');
            });
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            location.reload();
        }

        function checkAuthUI() {
            const isLogged = sessionStorage.getItem('isLoggedIn') === 'true';
            if (isLogged) {
                $('#btnLoginNav').addClass('d-none');
                $('#adminControls').removeClass('d-none');
                $('.admin-only').removeClass('admin-only').show(); // แสดงปุ่ม Add
            } else {
                $('#btnLoginNav').removeClass('d-none');
                $('#adminControls').addClass('d-none');
                // class admin-only ถูกซ่อนด้วย css อยู่แล้ว
            }
        }

        // === Data ===
        function fetchStats() {
            fetch(`${SCRIPT_URL}?action=getStats`).then(r => r.json()).then(d => $('#submissionCount').text(d.count));
        }

        function loadTableData() {
            const isLogged = sessionStorage.getItem('isLoggedIn') === 'true';

            fetch(`${SCRIPT_URL}?action=getData`)
            .then(r => r.json())
            .then(res => {
                globalData = res.data;
                const tbody = $('#tableBody'); 
                tbody.empty();
                
                if(res.data.length === 0) {
                    tbody.html('<tr><td colspan="5" class="text-center text-muted py-4">ไม่พบข้อมูล</td></tr>');
                    return;
                }

                res.data.forEach(item => {
                    let date = new Date(item.timestamp).toLocaleDateString('th-TH', {
                        day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit'
                    });
                    
                    // --- ส่วนจัดการปุ่ม (Fix: แสดง HTML ตลอด แต่เปลี่ยนเนื้อหา) ---
                    let manageContent = '';
                    if (isLogged) {
                        manageContent = `
                            <button class="btn btn-sm btn-warning mx-1" onclick="openEditModal('${item.id}')" title="แก้ไข">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button class="btn btn-sm btn-danger mx-1" onclick="deleteItem('${item.id}')" title="ลบ">
                                <i class="fas fa-trash"></i>
                            </button>
                        `;
                    } else {
                        manageContent = `<span class="text-muted small">-</span>`; // ถ้าไม่ Login ให้แสดงขีด
                    }

                    tbody.append(`
                        <tr>
                            <td><small class="text-muted">${date}</small></td>
                            <td>
                                <div class="fw-bold text-success">${item.fullname}</div>
                                <div class="small text-muted">(${item.nickname})</div>
                            </td>
                            <td>${item.agency}</td>
                            <td>
                                <div>${item.project_name}</div>
                                <a href="${item.project_link}" target="_blank" class="text-decoration-none small">
                                    <i class="fas fa-link"></i> Link
                                </a>
                            </td>
                            <td class="text-center">${manageContent}</td>
                        </tr>
                    `);
                });

                if ($.fn.DataTable.isDataTable('#dataTable')) { $('#dataTable').DataTable().destroy(); }

                $('#dataTable').DataTable({ 
                    language: { url: "//cdn.datatables.net/plug-ins/1.13.4/i18n/th.json" },
                    pageLength: 10, lengthChange: false, ordering: false
                });
            });
        }

        // === Add/Edit/Delete Logic ===
        function openAddModal() {
            $('#modalTitle').text('เพิ่มข้อมูลใหม่');
            $('#data_id').val(''); 
            $('#data_fullname, #data_nickname, #data_agency, #data_project_name, #data_project_link').val('');
            dataModal.show();
        }

        function openEditModal(id) {
            const item = globalData.find(x => String(x.id) === String(id));
            if (!item) return;

            $('#modalTitle').text('แก้ไขข้อมูล');
            $('#data_id').val(item.id); 
            $('#data_fullname').val(item.fullname);
            $('#data_nickname').val(item.nickname);
            $('#data_agency').val(item.agency);
            $('#data_project_name').val(item.project_name);
            $('#data_project_link').val(item.project_link);
            dataModal.show();
        }

        function saveData() {
            const id = $('#data_id').val();
            const action = id ? 'edit' : 'submit'; 
            
            const data = {
                action: action, id: id,
                fullname: $('#data_fullname').val(), nickname: $('#data_nickname').val(),
                agency: $('#data_agency').val(), project_name: $('#data_project_name').val(),
                project_link: $('#data_project_link').val()
            };

            Swal.fire({title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});

            fetch(SCRIPT_URL, {
                method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(res => {
                dataModal.hide();
                if(res.status === 'success'){
                    Swal.fire('สำเร็จ', 'เรียบร้อยแล้ว', 'success');
                    loadTableData(); fetchStats();
                } else {
                    Swal.fire('ผิดพลาด', res.message, 'error');
                }
            });
        }

        function deleteItem(id) {
            Swal.fire({
                title: 'ยืนยันลบ?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'ลบเลย'
            }).then((r) => {
                if(r.isConfirmed) {
                    Swal.showLoading();
                    fetch(SCRIPT_URL, {
                        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'delete', id: id })
                    })
                    .then(r => r.json())
                    .then(res => { 
                        if(res.status === 'success'){
                            Swal.fire('ลบแล้ว', '', 'success');
                            loadTableData(); fetchStats(); 
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
